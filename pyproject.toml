[project]
name = "agentctl"
version = "0.1.0"
description = "A local process runner for interruptible agent experiments"
requires-python = ">=3.13"
dependencies = ["pydantic==2.14.4"]

[project.scripts]
agentctl = "agentctl.cli:main"

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.15.20", "ty==0.0.55"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
