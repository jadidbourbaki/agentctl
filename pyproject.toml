[project]
name = "agent-runner"
version = "0.1.0"
description = "A local process runner for interruptible agent experiments"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
react = ["pydantic-ai-slim[openai]==2.30.0"]

[project.scripts]
agent-runner = "agent_runner.cli:main"
agent-react = "agent_runner.react:main"

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.15.20", "ty==0.0.55"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
